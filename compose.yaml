services:
  radar:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      DATABASE_PATH: /app/data/radar.sqlite
      LOCAL_DEMO: "false"
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - radar-data:/app/data
    security_opt:
      - no-new-privileges:true
volumes:
  radar-data:
